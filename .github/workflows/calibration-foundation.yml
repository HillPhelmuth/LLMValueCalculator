name: calibration-pr-smoke

on:
  pull_request:
    paths:
      - "CalibrationExperiments/**"
      - ".github/workflows/calibration-foundation.yml"
  push:
    branches: [main]
    paths:
      - "CalibrationExperiments/**"
  workflow_dispatch:
    inputs:
      live_openrouter:
        description: "Run the protected, budget-limited OpenRouter smoke"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks-and-fake-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CalibrationExperiments
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: pwsh -NoProfile -File scripts/ci-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-pr-smoke-${{ github.run_id }}
          path: |
            CalibrationExperiments/.ci-runs
            CalibrationExperiments/.calibration-runs
          if-no-files-found: ignore

  live-openrouter-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live_openrouter == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: calibration-pr-live
    defaults:
      run:
        working-directory: CalibrationExperiments
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CALIBRATION_LIVE_APPROVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: pwsh -NoProfile -File scripts/ci-smoke.ps1 -RunLiveOpenRouter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-openrouter-smoke-${{ github.run_id }}
          path: CalibrationExperiments/.ci-runs/openrouter
          if-no-files-found: ignore
