name: calibration-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: calibration-nightly
  cancel-in-progress: false

jobs:
  nightly-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: calibration-nightly
    defaults:
      run:
        working-directory: CalibrationExperiments
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CALIBRATION_NIGHTLY_LIVE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: New-Item -ItemType Directory -Force .nightly-runs | Out-Null
        shell: pwsh
      - uses: actions/cache/restore@v4
        with:
          path: CalibrationExperiments/.nightly-runs/baseline-cache/nightly-report.json
          key: calibration-nightly-${{ github.run_id }}
          restore-keys: calibration-nightly-
      - run: |
          if (Test-Path .nightly-runs/baseline-cache/nightly-report.json) {
            Copy-Item .nightly-runs/baseline-cache/nightly-report.json .nightly-runs/baseline.json -Force
          }
        shell: pwsh
      - run: pwsh -NoProfile -File scripts/nightly-calibration.ps1 -MaxCases 20
      - run: |
          $report = Get-Content .nightly-runs/nightly-report.json -Raw | ConvertFrom-Json
          foreach ($alert in $report.alerts) { Write-Output "::warning title=Calibration nightly drift::$alert" }
        shell: pwsh
      - run: |
          New-Item -ItemType Directory -Force .nightly-runs/baseline-cache | Out-Null
          Copy-Item .nightly-runs/nightly-report.json .nightly-runs/baseline-cache/nightly-report.json -Force
        shell: pwsh
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: CalibrationExperiments/.nightly-runs/baseline-cache/nightly-report.json
          key: calibration-nightly-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-nightly-${{ github.run_id }}
          path: CalibrationExperiments/.nightly-runs
          if-no-files-found: ignore
